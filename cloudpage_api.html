<script runat="server">
Platform.Load("core", "1.1.1");
Platform.Response.SetResponseHeader("Content-Type", "application/json; charset=utf-8");
Platform.Response.SetResponseHeader("Cache-Control", "no-store");

/* Lit une DE entière avec pagination WSProxy (pas de limite des 2500 lignes) */
function fetchAll(deKey, cols, filter) {
  var prox = new Script.Util.WSProxy(), out = [];
  var obj = "DataExtensionObject[" + deKey + "]";
  var r = filter ? prox.retrieve(obj, cols, filter) : prox.retrieve(obj, cols);
  while (r && r.Results) {
    for (var i = 0; i < r.Results.length; i++) {
      var o = {}, p = r.Results[i].Properties;
      for (var j = 0; j < p.length; j++) { o[p[j].Name] = p[j].Value; }
      out.push(o);
    }
    if (r.HasMoreRows) { r = prox.getNextBatch(obj, r.RequestID); } else { break; }
  }
  return out;
}
/* ---- IP allowlist : DE "DASH_IP_Allowlist" (IPAddress PK, Description). IPv4 exact / CIDR, IPv6 exact. Fail closed. ---- */
var IP_DE_KEY  = "DASH_IP_Allowlist";   /* Customer Key de la DE (Contact Builder > Data Extensions > Properties) */
var IP_DE_NAME = "DASH_IP_Allowlist";   /* Nom de la DE */
var ipDiag = "";
function trim(s) { return String(s === null || s === undefined ? "" : s).replace(/^\s+|\s+$/g, ""); }
/* Nettoie l'IP : 1re IP d'une liste, sans port, sans crochets IPv6 */
function cleanIp(raw) {
  var s = trim(raw).split(",")[0]; s = trim(s).toLowerCase();
  if (/^\d{1,3}(\.\d{1,3}){3}:\d+$/.test(s)) s = s.substring(0, s.lastIndexOf(":"));
  var m = s.match(/^\[([^\]]+)\](:\d+)?$/); if (m) s = m[1];
  return s;
}
function ipToNum(ip) {
  var p = String(ip).split("."); if (p.length !== 4) return null;
  var n = 0;
  for (var i = 0; i < 4; i++) {
    if (!/^\d{1,3}$/.test(p[i])) return null;
    var x = parseInt(p[i], 10); if (x > 255) return null;
    n = n * 256 + x;
  }
  return n;
}
/* Lit les lignes de la DE : 3 méthodes (clé via Core, clé via WSProxy, nom via Lookup) ; champ IP insensible à la casse */
function note(m) { ipDiag += (ipDiag ? " | " : "") + m; }
function loadAllowlist() {
  var rows = null;
  try { rows = DataExtension.Init(IP_DE_KEY).Rows.Retrieve(); note("Core(key)=" + (rows ? rows.length : 0)); } catch (e1) { note("Core(key) error: " + e1); }
  if (!rows || !rows.length) {
    try {
      var prox = new Script.Util.WSProxy(), obj = "DataExtensionObject[" + IP_DE_KEY + "]";
      var r = prox.retrieve(obj, ["IPAddress"]), tmp = [];
      while (r && r.Results) {
        for (var i = 0; i < r.Results.length; i++) { var o = {}, p = r.Results[i].Properties; for (var j = 0; j < p.length; j++) { o[p[j].Name] = p[j].Value; } tmp.push(o); }
        if (r.HasMoreRows) { r = prox.getNextBatch(obj, r.RequestID); } else { break; }
      }
      note("WSProxy(key)=" + tmp.length + (r && r.Status && !tmp.length ? " status:" + r.Status : ""));
      if (tmp.length) rows = tmp;
    } catch (e2) { note("WSProxy(key) error: " + e2); }
  }
  if (!rows || !rows.length) {
    try { var all = Platform.Function.LookupOrderedRows(IP_DE_NAME, 0, "IPAddress asc"); note("Lookup(name)=" + (all ? all.length : 0)); if (all && all.length) rows = all; } catch (e3) { note("Lookup(name) error: " + e3); }
  }
  var out = [];
  if (rows) for (var n = 0; n < rows.length; n++) {
    var rw = rows[n], v = null;
    for (var k in rw) { if (String(k).toLowerCase().replace(/[^a-z]/g, "") === "ipaddress") { v = rw[k]; break; } }
    if (v !== null) out.push(trim(v).toLowerCase());
  }
  note("entries=" + out.length);
  return out;
}
function isIpAllowed(ip) {
  ip = cleanIp(ip);
  if (!ip) return false;
  var list = loadAllowlist();
  var ipN = ipToNum(ip);
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (!e || e.charAt(0) === "#") continue;
    if (e === ip) return true;
    var s = e.indexOf("/");
    if (s > 0 && ipN !== null) {
      var base = ipToNum(e.substring(0, s)), bits = parseInt(e.substring(s + 1), 10);
      if (base === null || isNaN(bits) || bits < 0 || bits > 32) continue;
      var size = Math.pow(2, 32 - bits), start = Math.floor(base / size) * size;
      if (ipN >= start && ipN < start + size) return true;
    }
  }
  return false;
}
var clientIp = "", ipOk = false;
try { clientIp = Platform.Request.ClientIP; ipOk = isIpAllowed(clientIp); } catch (eIp) { ipOk = false; ipDiag += " | error: " + eIp; }

/* ---- Token : DE "DASH_Config" (ConfigKey, Value), ligne ConfigKey='token' ---- */
var CFG_DE_KEY = "DASH_Config";   /* Customer Key de la DE */
var CFG_DE_NAME = "DASH_Config";  /* Nom de la DE */
var cfgDiag = "";
function getConfigToken() {
  var v = "";
  try {
    var prox = new Script.Util.WSProxy();
    var r = prox.retrieve("DataExtensionObject[" + CFG_DE_KEY + "]", ["ConfigKey", "Value"], { Property: "ConfigKey", SimpleOperator: "equals", Value: "token" });
    if (r && r.Results && r.Results.length) {
      var p = r.Results[0].Properties;
      for (var j = 0; j < p.length; j++) { if (p[j].Name === "Value") v = trim(p[j].Value); }
    } else { cfgDiag += "WSProxy: 0 rows; "; }
  } catch (e1) { cfgDiag += "WSProxy error: " + e1 + "; "; }
  if (!v) {
    try { v = trim(Platform.Function.Lookup(CFG_DE_NAME, "Value", "ConfigKey", "token")); } catch (e2) { cfgDiag += "Lookup error: " + e2 + "; "; }
  }
  return v;
}
function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

function numFields(rows, fields) {
  for (var i = 0; i < rows.length; i++) { for (var j = 0; j < fields.length; j++) { rows[i][fields[j]] = num(rows[i][fields[j]]); } }
  return rows;
}
var warnings = [];
/* ---- Liens : lecture rapide par journey et par mois (LookupRows = requête SQL directe, bien plus rapide que le SOAP) ---- */
var LINK_DE_NAME = "DASH_Link_Monthly";   /* NOM de la DE (LookupRows) */
var LINK_DE_KEY  = "DASH_Link_Monthly";   /* Customer Key de la DE (repli WSProxy) */
var LINK_BUDGET_MS = 20000;               /* au-delà, on renvoie un résultat partiel plutôt qu une erreur 408 */
function monthsBetween(from, to) {
  var out = [];
  if (!/^\d{4}-\d{2}$/.test(from) || !/^\d{4}-\d{2}$/.test(to)) return out;
  var y = parseInt(from.substr(0, 4), 10), m = parseInt(from.substr(5, 2), 10), ty = parseInt(to.substr(0, 4), 10), tm = parseInt(to.substr(5, 2), 10);
  while ((y < ty || (y === ty && m <= tm)) && out.length < 24) { out.push(y + "-" + (m < 10 ? "0" + m : "" + m)); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function fetchLinks(jn, from, to) {
  var months = monthsBetween(from, to), out = [], t0 = new Date().getTime(), skipped = [], full = [];
  var cols = ["JourneyName","Month","EmailName","LinkName","LinkContent","UniqueClicks","TotalClicks"];
  if (!months.length) {   /* pas de période : repli sur toute la journey */
    return numFields(fetchAll(LINK_DE_KEY, cols, { Property: "JourneyName", SimpleOperator: "equals", Value: jn }), ["UniqueClicks","TotalClicks"]);
  }
  try {
    for (var i = months.length - 1; i >= 0; i--) {   /* mois les plus récents d abord */
      if (new Date().getTime() - t0 > LINK_BUDGET_MS) { skipped.push(months[i]); continue; }
      var rows = Platform.Function.LookupRows(LINK_DE_NAME, ["JourneyName", "Month"], [jn, months[i]]);
      if (rows) {
        for (var r = 0; r < rows.length; r++) {
          var o = {}; for (var c = 0; c < cols.length; c++) { o[cols[c]] = rows[r][cols[c]]; }
          out.push(o);
        }
        if (rows.length >= 2000) full.push(months[i]);
      }
    }
  } catch (eLk) {
    warnings.push("DASH_Link_Monthly (LookupRows): " + String(eLk.message || eLk) + " - repli sur WSProxy");
    out = fetchAll(LINK_DE_KEY, cols, { Property: "JourneyName", SimpleOperator: "equals", Value: jn });
    skipped = []; full = [];
  }
  if (skipped.length) warnings.push("links partial: months not loaded in time: " + skipped.join(", "));
  if (full.length) warnings.push("links truncated at 2000 rows for: " + full.join(", "));
  return numFields(out, ["UniqueClicks","TotalClicks"]);
}
function optional(deKey, cols, nums, label, filter) {
  try { return numFields(fetchAll(deKey, cols, filter), nums); }
  catch (eOpt) { warnings.push(label + ": " + String(eOpt.message || eOpt)); return []; }
}

try {
  /* Auth minimale : ?k=<token> comparé à DASH_Config (ConfigKey='token') ; part = core | links | sms */
  if (!ipOk) { Write(Stringify({ error: "forbidden" })); throw "STOP"; }
  var k = trim(Platform.Request.GetQueryStringParameter("k"));
  var part = trim(Platform.Request.GetQueryStringParameter("part")) || "core";
  var ref = getConfigToken();
  var why = "";
  if (!k) why = "no ?k= in the URL";
  else if (!ref) why = "token not found in DASH_Config (check key/name, ConfigKey='token')";
  else if (k !== ref) why = "token mismatch";
  if (why) {
    Write(Stringify({ error: "unauthorized: " + why + (cfgDiag ? " [" + cfgDiag + "]" : "") }));
  } else if (part === "links") {
    /* links : une journey et une période par appel (&j=<JourneyName>&from=yyyy-mm&to=yyyy-mm) pour rester sous le temps maximum de la CloudPage */
    var jn = trim(Platform.Request.GetQueryStringParameter("j"));
    if (!jn) { Write(Stringify({ error: "missing parameter j (journey name) for part=links" })); }
    else {
      var lf = trim(Platform.Request.GetQueryStringParameter("from")), lt = trim(Platform.Request.GetQueryStringParameter("to"));
      var links = [];
      try { links = fetchLinks(jn, lf, lt); } catch (eL) { warnings.push("DASH_Link_Monthly: " + String(eL.message || eL)); }
      Write(Stringify({ part: "links", j: jn, links: links, warnings: warnings }));
    }
  } else if (part === "sms") {
    var sms = optional("DASH_SMS_Monthly", ["JourneyName","Month","AssetName","Sent","Messages","UniqueRecipients","Delivered","Bounced"], ["Sent","Messages","UniqueRecipients","Delivered","Bounced"], "DASH_SMS_Monthly");
    Write(Stringify({ part: "sms", sms: sms, warnings: warnings }));
  } else {
    var kpi = fetchAll("DASH_Journey_KPI_Monthly",
      ["JourneyName","Month","Category","Sends","Bounces","Opens","UniqueClicks","Unsubscribes","Complaints"]);
    numFields(kpi, ["Sends","Bounces","Opens","UniqueClicks","Unsubscribes","Complaints"]);
    var conv = optional("DASH_Conversions",
      ["LeadId","JourneyName","Category","SendMonth","SendDate","LeadCreatedDate","LeadStatus","IsConverted","DaysToLead","Opened","Clicked","Product","LeadProduct","EmailName"],
      ["IsConverted","DaysToLead","Opened","Clicked"], "DASH_Conversions");
    var email = optional("DASH_Email_KPI_Monthly",
      ["JourneyName","Month","EmailName","Sends","Bounces","Opens","UniqueClicks","Unsubscribes","Complaints"],
      ["Sends","Bounces","Opens","UniqueClicks","Unsubscribes","Complaints"], "DASH_Email_KPI_Monthly");
    var domain = optional("DASH_Domain_Monthly", ["Domain","Month","Sends","Bounces","Complaints"], ["Sends","Bounces","Complaints"], "DASH_Domain_Monthly");
    Write(Stringify({ generatedMs: new Date().getTime(), kpi: kpi, conv: conv, email: email, domain: domain, warnings: warnings }));
  }
} catch (e) {
  if (e !== "STOP") { Write(Stringify({ error: String(e.message || e) })); }
}
</script>
