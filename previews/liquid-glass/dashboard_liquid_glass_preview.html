
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journeys Dashboard – Liquid Glass preview</title>
<style>
/* Design tokens inspirés du funnel Belfius Direct (couleurs, rayons, ombres, boutons en pilule) */
:root{
  --red:#c30045; --red-dark:#8c193c; --pink-bg:#fff5f8; --pink-light:#f6d8e3; --pink-mid:#f6c4d6; --pink-soft:#ffc2d7;
  --ink:#101820; --grey-dark:#51626f; --grey-light:#e8ebed; --grey-track:#e9eaeb; --focus:#ad0cdf; --err:#f5002d; --ok:#4b9b30;
  --bg:#f6f7f8; --card:#fff; --fg:#101820; --mute:#51626f; --line:#e8ebed; --acc:#c30045;
  --shadow:0 0 18px rgba(0,0,0,.10); --shadow-tile:0 5px 5px rgba(0,0,0,.10);
  --font:'Belfius21',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#18212b;--fg:#eef0f2;--mute:#9aa8b4;--line:#2b3744;--pink-bg:#2a1a22;--shadow:0 0 18px rgba(0,0,0,.4);--acc:#ff5c8a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
header{background:var(--red);color:#fff;padding:16px 24px 0}
header>*{max-width:1500px;margin-left:auto;margin-right:auto}
h1{font-size:1.25rem;font-weight:700;margin:0 auto 2px}
.sub{color:rgba(255,255,255,.85);font-size:.8rem}
.tabs{display:flex;gap:6px;margin-top:14px;border-bottom:1px solid rgba(255,255,255,.3);overflow-x:auto}
.tab{padding:10px 18px;border:0;background:none;color:rgba(255,255,255,.8);cursor:pointer;font:inherit;font-weight:600;border-bottom:3px solid transparent;border-radius:12px 12px 0 0;transition:background .15s;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.12)}
.tab[aria-selected=true]{color:#fff;border-color:#fff}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:#fff;color:var(--red);font-size:.7rem;font-weight:700;line-height:18px;text-align:center}
main{max-width:1500px;margin:auto;padding:20px 24px 48px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:0 0 16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px}
.bar label{display:flex;flex-direction:column;font-size:.75rem;color:var(--mute);gap:4px;font-weight:600}
select,input{font:inherit;color:var(--fg);padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);min-width:120px;transition:border-color .15s;max-width:420px}
select:hover,input:hover{border-color:var(--pink-soft)}
select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--red)}
button.btn{font:inherit;font-weight:600;padding:10px 24px;border-radius:25px;cursor:pointer;background:var(--red);color:#fff;border:2px solid var(--red);transition:border-color .15s}
button.btn:hover{border-color:var(--red-dark);background:var(--red-dark)}
button.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-tile);transition:transform .15s,border-color .15s}
.card:hover{transform:scale(1.015);border-color:var(--red)}
.card b{display:block;font-size:1.5rem;line-height:1.1;font-weight:600;color:var(--red);margin-bottom:4px}
.card span{font-size:.75rem;color:var(--mute)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:16px}
.charts .card{height:260px}.charts .card:hover{transform:none;border-color:transparent}
.wrap{overflow:auto;border-radius:16px;background:var(--card);box-shadow:var(--shadow);max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
td.wrapcell{white-space:normal;min-width:180px;max-width:420px;word-break:break-word}
thead th{position:sticky;top:0;background:var(--card);cursor:pointer;font-size:.75rem;font-weight:700;color:var(--grey-dark);z-index:1;border-bottom:2px solid var(--line)}
@media (prefers-color-scheme:dark){thead th{color:var(--mute)}}
thead th:hover{color:var(--red)}
thead th.sorted{color:var(--red)}
thead th.sorted::after{content:attr(data-arrow)}
tbody tr:hover td{background:var(--pink-bg)}
tr.tot td{font-weight:700;background:var(--pink-bg);color:var(--red)}
.btn2{font:inherit;font-size:.8rem;font-weight:600;padding:8px 14px;margin-right:6px;border-radius:20px;cursor:pointer;background:var(--card);color:var(--red);border:2px solid var(--pink-mid)}
.btn2:hover{border-color:var(--red)}
.btn2:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tg{border:0;background:var(--pink-bg);color:var(--red);width:22px;height:22px;border-radius:50%;cursor:pointer;margin-right:8px;font-size:.75rem;line-height:22px;padding:0;vertical-align:middle;transition:transform .15s}
.tg:hover{background:var(--pink-mid)}
.tg:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tg[aria-expanded=true]{transform:rotate(90deg)}
tr.child td{background:var(--pink-bg);font-size:.92em;color:var(--mute)}
tr.child td.ind{padding-left:44px;color:var(--fg)}
tr.child:hover td{background:var(--pink-light)}
@media (prefers-color-scheme:dark){tr.child:hover td{background:#3a2430}}
.h2{font-size:1rem;font-weight:700;margin:22px 0 10px}
.msg{padding:30px;text-align:center;color:var(--mute)}.err{color:#ffd6e1;font-weight:600}
.note{font-size:.75rem;color:var(--mute);margin-top:10px;padding-left:22px;position:relative}
.note::before{content:"i";position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;text-align:center;line-height:14px}
.warn{background:var(--pink-bg);border:2px solid var(--pink-mid);color:var(--red-dark);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.8rem}
@media (prefers-color-scheme:dark){.warn{color:var(--fg)}}
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.top{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px}
.top h3{margin:0 0 12px;font-size:.95rem}
.top ol{list-style:none;margin:0;padding:0}
.top li{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.top li:last-child{border:0}
.top .rk{color:var(--mute);font-weight:700}
.top .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .nm small{display:block;color:var(--mute);font-weight:400;font-size:.72rem}
.top .vl{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;text-align:right}
.top .vl small{display:block;color:var(--mute);font-weight:400;font-size:.72rem}
.top .bar2{grid-column:2/4;height:6px;border-radius:3px;background:var(--grey-track);overflow:hidden}
.top .bar2 i{display:block;height:100%;background:var(--red);border-radius:3px}
td.bad{color:var(--err);font-weight:700}
@media (max-width:768px){header{padding:12px 16px 0}main{padding:16px}.bar{padding:12px}.tab{padding:8px 12px}}
</style>
<style id="liquid-glass">
/* Liquid Glass theme (apercu) - principes du skill liquid-glass adaptes au web :
   - le verre n est utilise que sur la couche fonctionnelle (barre du haut, onglets, filtres, boutons)
   - le contenu (cartes, graphiques, tableaux) reste opaque
   - pas de verre sur du verre : les champs dans la barre de filtres sont de simples champs en creux
   - fond colore + barre fixe pour que le verre ait quelque chose a deformer
   - replis : reduction de transparence, contraste renforce, navigateur sans backdrop-filter */
:root{
  --lg-blur:22px; --lg-sat:180%;
  --glass:rgba(255,255,255,.38); --glass-brd:rgba(255,255,255,.7); --glass-hi:rgba(255,255,255,.9);
  --glass-shadow:0 12px 34px rgba(140,25,60,.18),0 2px 6px rgba(16,24,32,.06);
  --card:rgba(255,255,255,.9); --card-solid:#ffffff; --ctl:rgba(255,255,255,.62); --tab-sel:rgba(255,255,255,.92);
  --on-glass:#101820; --title:#8c193c; --sel-text:#c30045;
}
@media (prefers-color-scheme:dark){:root{
  --glass:rgba(34,40,52,.46); --glass-brd:rgba(255,255,255,.17); --glass-hi:rgba(255,255,255,.3);
  --glass-shadow:0 12px 34px rgba(0,0,0,.55);
  --card:rgba(24,33,43,.92); --card-solid:#18212b; --ctl:rgba(255,255,255,.10); --tab-sel:rgba(255,255,255,.22);
  --on-glass:#eef0f2; --title:#ffc2d7; --sel-text:#ffc2d7;
}}
body{background:#fdf0f4}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 36% at 10% 8%,rgba(195,0,69,.50),transparent 70%),
    radial-gradient(36% 42% at 90% 10%,rgba(173,12,223,.34),transparent 70%),
    radial-gradient(46% 46% at 82% 88%,rgba(255,122,168,.55),transparent 70%),
    radial-gradient(42% 40% at 8% 92%,rgba(255,194,215,.95),transparent 70%)}
@media (prefers-color-scheme:dark){
  body{background:#120a10}
  body::before{background:
    radial-gradient(42% 36% at 10% 8%,rgba(195,0,69,.55),transparent 70%),
    radial-gradient(36% 42% at 90% 10%,rgba(120,20,170,.45),transparent 70%),
    radial-gradient(46% 46% at 82% 88%,rgba(140,25,60,.55),transparent 70%),
    radial-gradient(42% 40% at 8% 92%,rgba(80,20,60,.7),transparent 70%)}}

/* ---- couche fonctionnelle : verre ---- */
header,.bar{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));
  backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));
  border:1px solid var(--glass-brd);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.14);
}
header{position:sticky;top:12px;z-index:50;width:calc(100% - 32px);max-width:1468px;margin:12px auto 0;padding:14px 20px 14px;border-radius:30px;color:var(--on-glass)}
header::before,.bar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%)}
.bar{position:relative;border-radius:26px}
h1{color:var(--title)}
.sub{color:var(--on-glass);opacity:.72}
header .tabs{width:fit-content;max-width:100%;margin:12px 0 0;border:0;background:rgba(255,255,255,.26);border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 1px 3px rgba(16,24,32,.10)}
@media (prefers-color-scheme:dark){header .tabs{background:rgba(255,255,255,.07)}}
.tab{border-radius:999px;border:0;padding:8px 16px;color:var(--on-glass);opacity:.82}
.tab:hover{background:rgba(255,255,255,.32);opacity:1}
.tab[aria-selected=true]{background:var(--tab-sel);color:var(--sel-text);opacity:1;box-shadow:0 1px 4px rgba(16,24,32,.16),inset 0 1px 0 rgba(255,255,255,.9)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.badge{background:var(--red);color:#fff}
header>*{max-width:none}

/* champs en creux : pas de verre sur du verre */
.bar label{color:var(--on-glass);opacity:.8}
select,input{background:var(--ctl);border:1px solid var(--glass-brd);border-radius:999px;padding:8px 14px;box-shadow:inset 0 1px 3px rgba(16,24,32,.08)}
select:hover,input:hover{border-color:var(--pink-soft)}
button.btn{background:linear-gradient(180deg,rgba(226,0,92,.95),rgba(195,0,69,.97));border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(195,0,69,.32)}
button.btn:hover{background:linear-gradient(180deg,rgba(236,20,110,.97),rgba(205,10,79,1));border-color:rgba(255,255,255,.7)}
button.btn:active{transform:scale(.97)}
.btn2{background:var(--ctl);border:1px solid var(--glass-brd);color:var(--sel-text);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn2:hover{border-color:var(--red)}
.btn2:active{transform:scale(.97)}

/* ---- couche contenu : opaque ---- */
.card,.top{background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 6px 22px rgba(140,25,60,.09)}
@media (prefers-color-scheme:dark){.card,.top{border-color:rgba(255,255,255,.08)}
  tr.tot td,.card b,.top .vl,thead th.sorted,thead th:hover{color:var(--sel-text)}
  .tg{color:var(--sel-text);background:rgba(255,255,255,.10)}
  .tg:hover{background:rgba(255,255,255,.2)}}
.wrap{background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:24px;box-shadow:0 6px 22px rgba(140,25,60,.09)}
@media (prefers-color-scheme:dark){.wrap{border-color:rgba(255,255,255,.08)}}
thead th{background:var(--card-solid)}
.note,.h2{color:var(--on-glass)}
.note{opacity:.78}
.warn{background:var(--card)}

/* ---- replis d accessibilite ---- */
@media (prefers-reduced-transparency:reduce){
  header,.bar{background:var(--card-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  header::before,.bar::before{display:none}
  body::before{opacity:.35}
}
@media (prefers-contrast:more){
  header,.bar{border:2px solid var(--fg);background:var(--card-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  select,input{border:2px solid var(--fg)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header,.bar{background:var(--card-solid)}
}
@media (max-width:768px){header{position:static;top:8px;width:calc(100% - 16px);border-radius:24px;padding:12px 14px}header .tabs{max-width:100%}}

</style>
</head>
<body>
<header>
  <h1>Journeys – Email KPIs</h1>
  <div class="sub" id="gen">Loading…</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="journeys" aria-selected="true">Journeys</button>
    <button class="tab" role="tab" data-tab="cats" aria-selected="false">Categories</button>
    <button class="tab" role="tab" data-tab="conv" aria-selected="false">Conversions (leads)</button>
    <button class="tab" role="tab" data-tab="ana" aria-selected="false">Journey analysis</button>
    <button class="tab" role="tab" data-tab="ins" aria-selected="false">Insights</button>
    <button class="tab" role="tab" data-tab="alerts" aria-selected="false">Alerts<span id="badge" class="badge" hidden></span></button>
    <button class="tab" role="tab" data-tab="sms" aria-selected="false">SMS</button>
  </div>
</header>
<main>
  <div class="bar">
    <label class="ctl" id="lFam">Family<select id="fFam"><option value="ALL">All</option><option value="MKT">Marketing (MKT_)</option><option value="OPS">Operational (Oxx_)</option></select></label>
    <label class="ctl" id="lType">Campaign type<select id="fType"><option value="">All</option></select></label>
    <label class="ctl" id="lProd">Product<select id="fProd"><option value="">All</option></select></label>
    <label class="ctl" id="lJ">Journey<select id="fJ"></select></label>
    <label class="ctl" id="lFrom">From month<select id="fFrom"></select></label>
    <label class="ctl" id="lTo">To month<select id="fTo"></select></label>
    <label class="ctl" id="lGran">Granularity<select id="fGran"><option value="total">Period total</option><option value="month">By month</option></select></label>
    <span class="ctl" id="lExp"><button class="btn2" id="bExp" type="button">Expand all</button><button class="btn2" id="bCol" type="button">Collapse all</button></span>
    <label class="ctl" id="lGrp">Group by<select id="fGrp"><option value="journey">Journey</option><option value="cat">Category</option><option value="type">Campaign type</option><option value="product">Product</option></select></label>
    <label class="ctl" id="lView">View by<select id="fView"><option value="cat">Category (prefix)</option><option value="type">Campaign type</option><option value="product">Product</option></select></label>
    <label class="ctl" id="lAlert">Alert scope<select id="fAlert"><option value="ongoing">Ongoing journeys only</option><option value="all">All journeys</option></select></label>
    <label class="ctl" id="lQ">Search<input id="fQ" placeholder="journey name…"></label>
    <button class="btn" id="bCsv">Export CSV</button>
  </div>
  <div id="warn" class="warn" hidden></div>

  <section id="v-main">
    <div id="cards" class="cards"></div>
    <div id="charts" class="charts"><div class="card"><canvas id="c1"></canvas></div><div class="card"><canvas id="c2"></canvas></div></div>
    <div class="wrap"><table id="tbl"></table></div>
    <div class="note" id="note"></div>
  </section>

  <section id="v-ana" hidden>
    <div id="aCards" class="cards"></div>
    <div class="charts"><div class="card"><canvas id="c3"></canvas></div></div>
    <div class="h2">By language</div>
    <div class="wrap"><table id="tLang"></table></div>
    <div class="h2">By email</div>
    <div class="wrap"><table id="tEmail"></table></div>
    <div class="h2">Links</div>
    <div class="wrap"><table id="tLinks"></table></div>
    <div class="note" id="aNote"></div>
  </section>

  <section id="v-ins" hidden>
    <div class="tops" id="tops"></div>
    <div class="note" id="iNote"></div>
  </section>

  <section id="v-alerts" hidden>
    <div id="alCards" class="cards"></div>
    <div class="wrap"><table id="tAlerts"></table></div>
    <div class="note" id="alNote"></div>
  </section>

  <section id="v-sms" hidden>
    <div id="smsCards" class="cards"></div>
    <div class="wrap"><table id="tSms"></table></div>
    <div class="note" id="smsNote"></div>
  </section>
</main>

<script>
/* ====== CONFIG : URL de la CloudPage API (cloudpage_api.html) ====== */
const API_URL = "https://VOTRE-SUBDOMAIN.pub.sfmc-content.com/XXXXXXXX";
/* ==================================================================== */

/* Volume alert settings */
const ALERT_DROP = 0.15;      /* alert when volume is more than 15 % below the expected pace */
const ALERT_MIN = 500;        /* only for journeys with more than 500 sends last month */
const ALERT_MIN_DAYS = 3;     /* do not alert before 3 full days of data in the month */

const PALETTE=['#c30045','#101820','#dc0078','#51626f','#4b9b30','#ad0cdf'];
const S = {tab:'journeys', fam:'ALL', type:'', prod:'', from:'', to:'', gran:'total', grp:'journey', view:'cat', q:'', j:'', alert:'ongoing'};
const SORT = {};   /* sort state per table id: {k,d} */
const EXP = new Set();   /* expanded journey rows (email activity detail) */
const EXPKEYS = {};      /* keys of the rows that can be expanded, per table */

const TABS = {
  journeys:{view:'main', ctl:['lFam','lType','lProd','lFrom','lTo','lGran','lExp','lQ'], csv:'tbl'},
  cats:    {view:'main', ctl:['lFam','lType','lProd','lFrom','lTo','lGran','lView','lQ'], csv:'tbl'},
  conv:    {view:'main', ctl:['lFam','lType','lProd','lFrom','lTo','lGran','lGrp','lExp','lQ'], csv:'tbl'},
  ana:     {view:'ana',  ctl:['lJ','lFrom','lTo'], csv:'tEmail'},
  ins:     {view:'ins',  ctl:['lFam','lType','lProd','lFrom','lTo'], csv:null},
  alerts:  {view:'alerts', ctl:['lAlert'], csv:'tAlerts'},
  sms:     {view:'sms',  ctl:['lFrom','lTo','lQ'], csv:'tSms'}
};

/* Naming convention journeys: MKT|Oxx _ TYPE _ PRODUCT _ Campaign name _ mmyyyy|ongoing
   Optional friendly labels (code -> label), to fill in once the full list is known. */
const LABELS = { type:{}, product:{} };
const lab = (kind, code) => LABELS[kind] && LABELS[kind][code] ? LABELS[kind][code]+' ('+code+')' : code;
const normProd = p => { p = String(p||'n/a').toUpperCase(); return p==='BIKE' ? 'BIK' : p; };

const _pc = new Map();
function parse(name){
  if (_pc.has(name)) return _pc.get(name);
  const p = String(name||'').split('_');
  const o = {fam:(p[0]||'n/a').toUpperCase(), type:'n/a', product:'n/a', campaign:name, period:'', covered:''};
  if (p.length >= 3){
    o.type = (p[1]||'n/a').toUpperCase(); o.product = normProd(p[2]);
    const last = p[p.length-1];
    if (p.length >= 5 && /^(\d{6}|ongoing)$/i.test(last)){ o.period = last.toLowerCase(); o.campaign = p.slice(3,-1).join('_'); }
    else o.campaign = p.slice(3).join('_');
  }
  o.covered = o.period==='ongoing' ? 'ongoing' : /^\d{6}$/.test(o.period) ? o.period.slice(2)+'-'+o.period.slice(0,2) : '';
  _pc.set(name,o); return o;
}

/* Email / asset names: MKT|Oxx _ TYPE _ PRODUCT _ Campaign[-info] _ FR|NL _ EMx _ mmyyyy|ongoing
   -> activity = FAM_TYPE_PRODUCT[(detail)]_Campaign ; "-info" after the campaign name, language, EMx and period are ignored */
const _ec = new Map();
function parseEmail(name){
  if (_ec.has(name)) return _ec.get(name);
  const raw = String(name||''), p = raw.split('_');
  const o = {raw, fam:(p[0]||'').toUpperCase(), type:(p[1]||'').toUpperCase(), product:normProd(p[2]), campaign:'', lang:'', detail:'', label:raw};
  if (p.length >= 4){
    const campRaw = p[3]||'';
    o.campaign = campRaw.split('-')[0];
    for (let i=4;i<p.length;i++){ if (/^(FR|NL)$/i.test(p[i])){ o.lang = p[i].toUpperCase(); break; } }
    const low = raw.toLowerCase();
    if (o.product==='PET') o.detail = /dog|chien|hond/.test(low) ? 'dog' : /cat(?!alog|egor)|chat|kat/.test(low) ? 'cat' : '';
    if (o.product==='HOM') o.detail = /renter|locataire|huurder/.test(low) ? 'renters' : /owner|proprio|eigenaar/.test(low) ? 'owner' : '';
    o.label = [o.fam, o.type, o.product+(o.detail?' ('+o.detail+')':''), o.campaign].join('_');
  }
  _ec.set(name,o); return o;
}

const DIMLAB = {journey:'Journey', activity:'Journey + email activity', cat:'Category', type:'Campaign type', product:'Product'};

const dimShow = (dim,v) => dim==='type' ? lab('type',v) : dim==='product' ? lab('product',v) : v;
let D = {kpi:[], conv:[], email:[], domain:[], links:null, sms:null, generatedMs:0}, charts = [], LOADING = {};
const $ = id => document.getElementById(id);
const NF = new Intl.NumberFormat('fr-BE');
const PF = new Intl.NumberFormat('fr-BE',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});
const n = v => NF.format(v||0);
const pct = (a,b) => b>0 ? PF.format(a/b) : '–';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const famOf = name => /^MKT_/i.test(name) ? 'MKT' : 'OPS';

/* ---------- filtres ---------- */
const inScope = (name, month) =>
  (S.fam==='ALL' || famOf(name)===S.fam) &&
  (!S.type || parse(name).type===S.type) && (!S.prod || parse(name).product===S.prod) &&
  (!S.from || month>=S.from) && (!S.to || month<=S.to) &&
  (!S.q || name.toLowerCase().includes(S.q.toLowerCase()));
const inMonths = m => (!S.from || m>=S.from) && (!S.to || m<=S.to);

function group(rows, keyFn){
  const m = new Map();
  for (const r of rows){
    const [name,month,act] = keyFn(r), key = name+'|'+(act||'')+'|'+month;
    let a = m.get(key);
    if(!a){ a={name,month,act:act||'',last:'',Sends:0,Bounces:0,Opens:0,Clicks:0,Unsubs:0,Compl:0}; m.set(key,a); }
    if (r.Month > a.last) a.last = r.Month;
    a.Sends+=r.Sends; a.Bounces+=r.Bounces; a.Opens+=r.Opens; a.Clicks+=r.UniqueClicks; a.Unsubs+=r.Unsubscribes; a.Compl+=r.Complaints;
  }
  return [...m.values()];
}
const deliv = a => a.Sends - a.Bounces;
const ZERO = () => ({Sends:0,Bounces:0,Opens:0,Clicks:0,Unsubs:0,Compl:0});

/* ---------- colonnes KPI ---------- */

  {k:'rDel',   l:'Delivery %',v:a=>a.Sends?deliv(a)/a.Sends:-1,   f:a=>pct(deliv(a),a.Sends)},
  {k:'Bounce', l:'Bounces',   v:a=>a.Bounces,      f:a=>n(a.Bounces)},
  {k:'rBnc',   l:'Bounce %',  v:a=>a.Sends?a.Bounces/a.Sends:-1,   f:a=>pct(a.Bounces,a.Sends)},
  {k:'Opens',  l:'Opens',     v:a=>a.Opens,        f:a=>n(a.Opens)},

/* colonnes d'identité d'une journey : Campaign > Month (covered) > Family > Type > Product (+ activity, + send month) */
function journeyCols(withAct, monthly, monthLabel){

/* ---------- generic table renderer ---------- */
function renderTable(id, keyCols, cols, rows, total, opts){
  opts = opts||{};
  const all = [...keyCols.map(c=>({...c,left:true})), ...cols];
  const st = SORT[id];
  let sk = st && all.find(c=>c.k===st.k) ? st.k : null, dir = st&&sk ? st.d : -1;
  rows = [...rows];
  if (sk){ const sc = all.find(c=>c.k===sk); rows.sort((a,b)=>{const x=sc.v(a),y=sc.v(b);return (x>y?1:x<y?-1:0)*dir;}); }
  else if (opts.cmp){ rows.sort(opts.cmp); }
  else { sk = opts.defK && all.find(c=>c.k===opts.defK) ? opts.defK : cols[0]?.k; dir=-1; const sc=all.find(c=>c.k===sk); rows.sort((a,b)=>{const x=sc.v(a),y=sc.v(b);return (x>y?1:x<y?-1:0)*dir;}); }
  /* child rows (email activities) sorted by the sorted numeric column, else by the first numeric column */
  const kc = (sk && cols.find(c=>c.k===sk)) || cols[0];
  const rowKey = r => id+'|'+r.name+'|'+(r.month||'');
  const keys = [];
  let h = '<thead><tr>'+all.map(c=>`<th class="${c.left?'l':''} ${c.k===sk?'sorted':''}" data-k="${c.k}" data-arrow="${dir>0?' ▲':' ▼'}">${esc(c.l)}</th>`).join('')+'</tr></thead><tbody>';
  if (total) h += '<tr class="tot">'+all.map(c=>`<td class="${c.left?'l':''}">${c.left? (c===all[0]?'TOTAL':'') : c.f(total)}</td>`).join('')+'</tr>';
  for (const r of rows){
    const ch = opts.children ? opts.children(r) : null, rk = rowKey(r), open = !!(ch && ch.length && EXP.has(rk));
    if (ch && ch.length) keys.push(rk);
    h += '<tr>'+all.map((c,i)=>{
      let inner = c.f(r);
      if (i===0 && ch && ch.length) inner = `<button type="button" class="tg" data-rk="${esc(rk)}" aria-expanded="${open}" title="Show / hide email activities" aria-label="Show or hide email activities">▸</button>`+inner;
      return `<td class="${(c.left?'l ':'')+(c.cls?c.cls(r):'')}">${inner}</td>`;
    }).join('')+'</tr>';
    if (open) for (const x of [...ch].sort((a,b)=>kc.v(b)>kc.v(a)?1:kc.v(b)<kc.v(a)?-1:0))
      h += '<tr class="child">'+all.map((c,i)=> c.left ? (i===0 ? `<td class="l ind">↳ ${esc(x.act||x.name)}</td>` : '<td class="l"></td>') : `<td>${c.f(x)}</td>`).join('')+'</tr>';
  }
  if (!rows.length) h += `<tr><td class="l msg" colspan="${all.length}">${esc(opts.empty||'No data for the current selection.')}</td></tr>`;
  h += '</tbody>';
  EXPKEYS[id] = keys;
  $(id).innerHTML = h;
  $(id).querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k, cur=SORT[id]; SORT[id] = {k, d: cur&&cur.k===k ? -cur.d : -1}; render();
  });
  $(id).querySelectorAll('.tg').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.rk; EXP.has(k)?EXP.delete(k):EXP.add(k); render(); });
}

const kpiCards = tot => [[n(tot.Sends),'Sends'],[n(deliv(tot)),'Delivered'],[pct(deliv(tot),tot.Sends),'Delivery rate'],[pct(tot.Opens,deliv(tot)),'Open rate'],

/* ---------- Conversions ---------- */
function convAgg(rows, dim, monthly, act){
  const src = (act ? D.email : D.kpi).filter(r=>inScope(r.JourneyName,r.Month));
  const kg = group(src, r=>[dimVal(r,dim), monthly?r.Month:'', act?parseEmail(r.EmailName).label:'']);
  const dmap = new Map(kg.map(a=>[a.name+'|'+a.act+'|'+a.month, deliv(a)]));
  const m = new Map();
  for (const r of rows){
    const nm = dimVal(r,dim), ac = act ? parseEmail(r.EmailName).label : '', mo = monthly?r.SendMonth:'', key = nm+'|'+ac+'|'+mo;
    let a = m.get(key);
    if(!a){ a={name:nm,act:ac,month:mo,last:r.SendMonth,Leads:0,Conv:0,Open:0,Click:0,Days:0,St:{}}; m.set(key,a); }
    if (r.SendMonth>a.last) a.last=r.SendMonth;
    a.Leads++; a.Conv+=r.IsConverted; a.Open+=r.Opened; a.Click+=r.Clicked; a.Days+=r.DaysToLead;
    const s=r.LeadStatus||'(empty)'; a.St[s]=(a.St[s]||0)+1;
  }
  const out = [...m.values()]; out.forEach(a=>a.Deliv=dmap.get(a.name+'|'+a.act+'|'+a.month)||0);
  return {out, dmap};
}

/* ---------- Alerts ---------- */
function computeAlerts(){
  const ms = D.generatedMs || Date.now();
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms)).map(p=>[p.type,p.value]));
  const y=+parts.year, mo=+parts.month, d=+parts.day;
  const pad = x => String(x).padStart(2,'0');
  const cur = y+'-'+pad(mo), prev = mo===1 ? (y-1)+'-12' : y+'-'+pad(mo-1);
  const dim = new Date(y,mo,0).getDate(), elapsed = d-1;
  const agg = new Map();
  for (const r of D.kpi){
    if (r.Month!==cur && r.Month!==prev) continue;
    let a = agg.get(r.JourneyName); if(!a){ a={name:r.JourneyName,prev:0,cur:0,last:r.Month}; agg.set(r.JourneyName,a); }
    if (r.Month===prev) a.prev+=r.Sends; else a.cur+=r.Sends;
    if (r.Month>a.last) a.last=r.Month;
  }
  const rows = [];
  for (const a of agg.values()){
    if (a.prev <= ALERT_MIN) continue;
    if (S.alert==='ongoing' && parse(a.name).period!=='ongoing') continue;
    a.expected = a.prev * elapsed / dim;
    a.change = a.expected>0 ? a.cur/a.expected - 1 : 0;
    a.alert = elapsed>=ALERT_MIN_DAYS && a.cur < a.expected*(1-ALERT_DROP);
    rows.push(a);
  }
  return {rows, cur, prev, elapsed, dim, early: elapsed<ALERT_MIN_DAYS};
}
function viewAlerts(){
  const A = computeAlerts(), list = A.rows.filter(a=>a.alert);
  cards('alCards', [[list.length,'Journeys in alert'],[A.rows.length,'Journeys monitored (> '+n(ALERT_MIN)+' sends in '+A.prev+')'],[A.cur,'Current month'],[A.elapsed+' / '+A.dim,'Days elapsed / days in month']]);
  const cols = [
    {k:'prev',l:'Sends '+A.prev,v:a=>a.prev,f:a=>n(a.prev)},
    {k:'exp',l:'Expected so far',v:a=>a.expected,f:a=>n(Math.round(a.expected))},
    {k:'cur',l:'Sends '+A.cur+' (so far)',v:a=>a.cur,f:a=>n(a.cur)},
    {k:'chg',l:'Change vs expected',v:a=>a.change,f:a=>(a.change>0?'+':'')+(a.change*100).toFixed(1).replace('.',',')+' %',cls:a=>a.alert?'bad':''}
  ];
  const kc = journeyCols(false,false).map(c=>({...c,v:a=>c.v({name:a.name})}));
  renderTable('tAlerts', kc, cols, list, null, {cmp:(a,b)=>a.change-b.change, empty: A.early ? 'Too early in the month to compare volumes (needs '+ALERT_MIN_DAYS+' full days).' : 'No volume alert: all monitored journeys are within '+(ALERT_DROP*100)+' % of the expected pace.'});
  $('alNote').textContent = "Compares sends so far this month with last month's volume pro-rated to the days elapsed (data is refreshed nightly, up to yesterday). Alert when more than "+(ALERT_DROP*100)+" % below, for journeys with more than "+n(ALERT_MIN)+" sends last month. A journey with no send this month shows −100 %. Dated campaign journeys are excluded unless the scope is set to all journeys.";
  const b = $('badge'); const cnt = list.length; b.textContent = cnt; b.hidden = !cnt;
}
function updateBadge(){ const A=computeAlerts(); const c=A.rows.filter(a=>a.alert).length; $('badge').textContent=c; $('badge').hidden=!c; }

/* ---------- Journey analysis ---------- */
async function viewAna(){
  if (!S.j){ $('aCards').innerHTML=''; return; }
  const kRows = D.kpi.filter(r=>r.JourneyName===S.j && inMonths(r.Month));
  const eRows = D.email.filter(r=>r.JourneyName===S.j && inMonths(r.Month));
  const tot = group(kRows, r=>['','']) [0] || group(eRows, r=>['','']) [0] || ZERO();
  cards('aCards', kpiCards(tot));
  drawCharts([byMonthCharts(kRows)[0]], ['c3']);
  const keyL = [{k:'name',l:'Language',v:a=>a.name,f:a=>esc(a.name)}];
  const byLang = group(eRows, r=>[parseEmail(r.EmailName).lang||'n/a','']);
  const empty = 'Email-level data not available yet (DASH_Email_KPI_Monthly).';
  renderTable('tLang', keyL, KPI_COLS, byLang, byLang.length>1?tot:null, {defK:'Sends', empty});
  const keyE = [{k:'name',l:'Email',v:a=>a.name.toLowerCase(),f:a=>`<span title="${esc(parseEmail(a.name).label)}">${esc(a.name)}</span>`},
                {k:'lang',l:'Lang',v:a=>parseEmail(a.name).lang,f:a=>esc(parseEmail(a.name).lang||'–')}];
  const byEmail = group(eRows, r=>[r.EmailName||'(unknown)','']);
  renderTable('tEmail', keyE, KPI_COLS, byEmail, byEmail.length>1?tot:null, {defK:'Sends', empty});
  /* links : chargés à la demande */
  const lc = [{k:'email',l:'Email',v:a=>a.email.toLowerCase(),f:a=>esc(a.email)},{k:'lang',l:'Lang',v:a=>a.lang,f:a=>esc(a.lang||'–')},
              {k:'link',l:'Link name',v:a=>a.link.toLowerCase(),f:a=>esc(a.link||'–')},{k:'content',l:'Link content',v:a=>a.content.toLowerCase(),f:a=>`<span title="${esc(a.content)}">${esc(a.content.length>80?a.content.slice(0,80)+'…':a.content||'–')}</span>`}];
  const lcols = [{k:'uq',l:'Unique clicks',v:a=>a.uq,f:a=>n(a.uq)},{k:'tot',l:'Total clicks',v:a=>a.tot,f:a=>n(a.tot)}];
  if (D.links===null){
    $('tLinks').innerHTML = '<tbody><tr><td class="l msg">Loading links…</td></tr></tbody>';
    loadPart('links').then(()=>{ if (S.tab==='ana') render(); });
  } else {
    const m = new Map();
    for (const r of D.links){ if (r.JourneyName!==S.j || !inMonths(r.Month)) continue;
      const key=r.EmailName+'|'+r.LinkName+'|'+r.LinkContent; let a=m.get(key);
      if(!a){ a={email:r.EmailName||'',lang:parseEmail(r.EmailName).lang,link:r.LinkName||'',content:r.LinkContent||'',uq:0,tot:0}; m.set(key,a); }
      a.uq+=r.UniqueClicks; a.tot+=r.TotalClicks; }
    const list=[...m.values()], lt={uq:list.reduce((x,a)=>x+a.uq,0),tot:list.reduce((x,a)=>x+a.tot,0)};
    renderTable('tLinks', lc, lcols, list, list.length>1?lt:null, {defK:'uq', empty:'No link data for this journey (DASH_Link_Monthly).'});
  }
  $('aNote').textContent = "FR / NL are read from the email name (_FR_ / _NL_). Links: unique clicks = first click of a recipient on a link, total clicks = all clicks; attributed to the send month. Same rate definitions as the Journeys tab.";
}

/* ---------- Insights ---------- */
function topList(title, items, fmtVal){
  const max = Math.max(1, ...items.map(i=>i.val));
  return `<div class="top"><h3>${esc(title)}</h3>${items.length?'<ol>'+items.map((i,x)=>`<li><span class="rk">${x+1}</span><span class="nm" title="${esc(i.title||i.name)}">${esc(i.name)}${i.sub?`<small>${esc(i.sub)}</small>`:''}</span><span class="vl">${fmtVal(i.val)}${i.extra?`<small>${esc(i.extra)}</small>`:''}</span><span class="bar2"><i style="width:${Math.round(i.val/max*100)}%"></i></span></li>`).join('')+'</ol>':'<div class="msg">No data</div>'}</div>`;
}
function viewIns(){
  const dm = new Map();
  for (const r of D.domain){ if(!inMonths(r.Month)) continue; let a=dm.get(r.Domain); if(!a){a={name:r.Domain,Sends:0,Bounces:0,Complaints:0};dm.set(r.Domain,a);} a.Sends+=r.Sends;a.Bounces+=r.Bounces;a.Complaints+=r.Complaints; }
  const doms = [...dm.values()];
  const top = (arr,key,extra) => arr.filter(a=>a[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,5).map(a=>({name:a.name,val:a[key],extra:extra?extra(a):''}));
  const jr = group(D.kpi.filter(r=>inScope(r.JourneyName,r.Month)), r=>[r.JourneyName,'']);
  const topJ = jr.filter(a=>a.Bounces>0).sort((a,b)=>b.Bounces-a.Bounces).slice(0,5).map(a=>({name:parse(a.name).campaign,title:a.name,sub:parse(a.name).fam+' · '+parse(a.name).type+' · '+parse(a.name).product+(parse(a.name).covered?' · '+parse(a.name).covered:''),val:a.Bounces,extra:pct(a.Bounces,a.Sends)+' of sends'}));
  $('tops').innerHTML =
    topList('Top 5 domains – emails sent', top(doms,'Sends'), n) +
    topList('Top 5 domains – bounces', top(doms,'Bounces',a=>pct(a.Bounces,a.Sends)+' of sends'), n) +
    topList('Top 5 domains – complaints', top(doms,'Complaints',a=>pct(a.Complaints,a.Sends)+' of sends'), n) +
    topList('Top 5 journeys – bounces', topJ, n);
  $('iNote').textContent = "Domains: all MKT_/Oxx_ journeys, filtered by the selected months only (domains with at least 20 sends in a month). The journeys ranking also follows the Family / Type / Product filters." + (D.domain.length?'':' Domain data not available yet (DASH_Domain_Monthly).');
}

/* ---------- SMS ---------- */
function viewSms(){
  if (D.sms===null){
    $('tSms').innerHTML = '<tbody><tr><td class="l msg">Loading SMS data…</td></tr></tbody>'; cards('smsCards',[]);
    loadPart('sms').then(()=>{ if (S.tab==='sms') render(); }); return;
  }
  const m = new Map();
  for (const r of D.sms){
    if (!inMonths(r.Month) || (S.q && !String(r.JourneyName).toLowerCase().includes(S.q.toLowerCase()))) continue;
    const asset = parseEmail(r.AssetName).label, key = r.JourneyName+'|'+asset; let a = m.get(key);
    if(!a){ a={name:r.JourneyName,asset,Sent:0,Uniq:0,Deliv:0,Bnc:0}; m.set(key,a); }
    a.Sent+=r.Sent; a.Uniq+=r.UniqueRecipients; a.Deliv+=r.Delivered; a.Bnc+=r.Bounced;
  }
  const rows=[...m.values()], tot=rows.reduce((t,a)=>({Sent:t.Sent+a.Sent,Uniq:t.Uniq+a.Uniq,Deliv:t.Deliv+a.Deliv,Bnc:t.Bnc+a.Bnc}),{Sent:0,Uniq:0,Deliv:0,Bnc:0});
  cards('smsCards', [[n(tot.Sent),'SMS sent'],[n(tot.Uniq),'Unique recipients'],[n(tot.Deliv),'Delivered'],[pct(tot.Deliv,tot.Sent),'Delivered %'],[n(tot.Bnc),'Bounced'],[pct(tot.Bnc,tot.Sent),'Bounced %']]);
  const keyCols=[{k:'name',l:'Journey',v:a=>a.name.toLowerCase(),f:a=>esc(a.name)},{k:'asset',l:'Asset',v:a=>a.asset.toLowerCase(),f:a=>esc(a.asset)}];
  const cols=[{k:'Sent',l:'Total sent',v:a=>a.Sent,f:a=>n(a.Sent)},{k:'Uniq',l:'Unique',v:a=>a.Uniq,f:a=>n(a.Uniq)},
              {k:'Deliv',l:'Delivered',v:a=>a.Deliv,f:a=>n(a.Deliv)},{k:'rDel',l:'Delivered %',v:a=>a.Sent?a.Deliv/a.Sent:-1,f:a=>pct(a.Deliv,a.Sent)},
              {k:'Bnc',l:'Bounced',v:a=>a.Bnc,f:a=>n(a.Bnc)},{k:'rBnc',l:'Bounced %',v:a=>a.Sent?a.Bnc/a.Sent:-1,f:a=>pct(a.Bnc,a.Sent)}];
  renderTable('tSms', keyCols, cols, rows, rows.length>1?tot:null, {defK:'Sent', empty:'No SMS data yet (DASH_SMS_Monthly).'});
  $('smsNote').textContent = "SMS per journey and asset. Total sent counts every message part (long SMS are split in several parts); unique = distinct recipients per month. The asset name ignores the language and anything after a \"-\" in the campaign name.";
}

/* ---------- affichage ---------- */
function render(){
  const cfg = TABS[S.tab];
  document.querySelectorAll('.ctl').forEach(el=>el.hidden = !cfg.ctl.includes(el.id));
  if (S.tab==='conv' && S.grp!=='journey') $('lExp').hidden = true;
  $('bCsv').hidden = !cfg.csv;
  ['main','ana','ins','alerts','sms'].forEach(v=>$('v-'+v).hidden = v!==cfg.view);
  if (S.tab==='journeys') viewKpi('journey'); else if (S.tab==='cats') viewKpi(S.view); else if (S.tab==='conv') viewConv();
  else if (S.tab==='ana') viewAna(); else if (S.tab==='ins') viewIns(); else if (S.tab==='alerts') viewAlerts(); else viewSms();
  updateBadge();
}

async function api(part){
  const k = new URLSearchParams(location.search).get('k')||'';
  const res = await fetch(API_URL+'?k='+encodeURIComponent(k)+(part?'&part='+part:''),{cache:'no-store'});
  const j = await res.json(); if (j.error) throw new Error(j.error); return j;
}
function showWarn(w){ if (w && w.length){ $('warn').hidden=false; $('warn').textContent='Some data sources are unavailable: '+w.join(' · '); } }
async function loadPart(part){
  if (LOADING[part]) return LOADING[part];
  LOADING[part] = api(part).then(j=>{ D[part] = j[part]||[]; showWarn(j.warnings); }).catch(e=>{ D[part]=[]; showWarn([part+': '+e.message]); });
  return LOADING[part];
}

/* ---------- init ---------- */
function setup(){
  const months = [...new Set([...D.kpi.map(r=>r.Month),...D.conv.map(r=>r.SendMonth),...D.email.map(r=>r.Month),...D.domain.map(r=>r.Month)])].filter(Boolean).sort();
  const opts = months.map(m=>`<option>${m}</option>`).join('');
  $('fFrom').innerHTML = opts; $('fTo').innerHTML = opts;
  S.from = months[Math.max(0,months.length-12)] || ''; S.to = months[months.length-1] || '';
  $('fFrom').value = S.from; $('fTo').value = S.to;
  const names = [...new Set([...D.kpi,...D.conv].map(r=>r.JourneyName))];
  const fill = (id,kind) => { const vals=[...new Set(names.map(nm=>parse(nm)[kind]))].sort();
    $(id).innerHTML = '<option value="">All</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(lab(kind,v))}</option>`).join(''); };
  fill('fType','type'); fill('fProd','product');
  const last = new Map(); D.kpi.forEach(r=>{ if((last.get(r.JourneyName)||'')<r.Month) last.set(r.JourneyName,r.Month); });
  const js = [...last.keys()].sort((a,b)=>(last.get(b)>last.get(a)?1:last.get(b)<last.get(a)?-1:0)||(covKey(b)>covKey(a)?1:covKey(b)<covKey(a)?-1:0)||(a<b?-1:1));
  $('fJ').innerHTML = js.map(j=>{const p=parse(j);return `<option value="${esc(j)}">${esc(p.campaign+' · '+(p.covered||'–')+' · '+p.fam+' · '+p.type+' · '+p.product)}</option>`;}).join('');
  S.j = js[0] || '';
  const on = (id,fn)=>{ $(id).onchange = e=>{fn(e.target.value); SORT.tbl=null; render();}; };
  on('fType',v=>S.type=v); on('fProd',v=>S.prod=v); on('fView',v=>S.view=v); on('fFam',v=>S.fam=v);
  on('fFrom',v=>S.from=v); on('fTo',v=>S.to=v); on('fGran',v=>S.gran=v); on('fGrp',v=>S.grp=v);
  on('fJ',v=>S.j=v); on('fAlert',v=>S.alert=v);
  $('bExp').onclick = ()=>{ (EXPKEYS.tbl||[]).forEach(k=>EXP.add(k)); render(); };
  $('bCol').onclick = ()=>{ (EXPKEYS.tbl||[]).forEach(k=>EXP.delete(k)); render(); };
  $('fQ').oninput = e=>{S.q=e.target.value;render();};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
    S.tab=b.dataset.tab; SORT.tbl=null; render();
  });
  $('bCsv').onclick = ()=>{
    const id = TABS[S.tab].csv; if(!id) return;
    const csv = [...$(id).rows].map(r=>[...r.cells].map(c=>'"'+c.textContent.replace(/"/g,'""')+'"').join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
    a.download = 'dashboard_'+S.tab+'.csv'; a.click();
  };
}

(async()=>{
  try{
    const j = await api('');
    D = {kpi:j.kpi||[], conv:j.conv||[], email:j.email||[], domain:j.domain||[], links:null, sms:null, generatedMs:j.generatedMs||0};
    $('gen').textContent = 'Data as of '+(j.generatedMs ? new Intl.DateTimeFormat('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels',timeZoneName:'short'}).format(new Date(j.generatedMs)) : '–')+' · months in CET/CEST';
    showWarn(j.warnings);
    setup(); render();
  }catch(e){
    $('gen').innerHTML = '<span class="err">Error: '+esc(e.message)+'</span>';
  }
})();
</script>
</body>
</html>
